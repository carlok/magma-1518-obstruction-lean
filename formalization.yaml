version: "v0.4"

project:
  name: "One-generated (1518 + 3862)-magmas are trivial or the Z/3 shift; an explicit family of finite 1518-magmas violating laws 47, 614, 817, 3862"
  description: >-
    Lean 4 results (core Lean, no dependencies, no axioms beyond the standard three) about law 1518 of the Equational
    Theories Project, x = (y ◇ y) ◇ (x ◇ (y ◇ x)). Theorem A: in every magma satisfying 1518 and 3862
    (x ◇ x = (x ◇ (x ◇ x)) ◇ x), writing S x = x ◇ x, the set {x, S x, S (S x)} is closed under ◇ with u ◇ v = S v and
    S (S (S x)) = x; hence every one-generated such magma is the trivial magma or the three-element cyclic shift
    x ◇ y = y + 1. This proves, in a stronger form (one target law instead of four, no finiteness), a conjecture stated
    by Terence Tao on the Lean Zulip on 2024-11-29. Theorem F, two members formalized: for any commutative ring R with
    1/2 and an element i with i² = −1, and any nonzero R-module M, an explicit table on Z/3 × M with coefficients in
    Z[i, 1/2] satisfies 1518 and violates 47, 614, 817 and 3862, with squaring map of order 12; the members over F_5
    (15 elements) and F_13 (39 elements), defined by their coefficient matrices, are checked by kernel evaluation.
    Outside the compared declarations the repository holds kernel-checked certificate identities behind a cohomological
    obstruction theorem (every 1518-cocycle over the shift with finite fibre is a coboundary), whose reduction is a
    written proof, and the computations classifying base-dependent extensions of the shift.
  authors:
    - "Carlo Perassi"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Carlo Perassi"

