      The Equational Theories Project's Lean-verified 15-element countermodel to 1518 ⇒ 47, 614, 817, 3862, given as a
      lookup table. The F_5 member of Theorem F is isomorphic to it but is defined here by its coefficient matrices on
      Z/3 × F_5, together with the 39-element member and, outside Lean, the whole family. Not a Lean dependency of this
      project.

status:
  scope: >-
    Formalized in the compared declarations: Theorem A for arbitrary magmas satisfying 1518 and 3862 (Magma1518.table,
    cube, words_in_T, one_or_three), with no finiteness hypothesis. Not among the compared declarations, though present
    in the repository and kernel-checked there: the F_5 and F_13 members of Theorem F (lean/FamilyF5.lean,
    lean/FamilyF13.lean). Not formalized at all: Theorem F for a general ring and module (verified by exact arithmetic in Q(i) outside Lean, scripts/basedep_family.py); the classification of
    base-dependent extensions of the shift (exhaustive enumeration to p = 61 and Gröbner bases to p = 257, outside
    Lean); the cohomological results (H² = 0 over the shift, the obstruction theorem), whose certificate identities are
    kernel-checked in lean/L2Cert.lean and lean/H2Cert.lean but whose reduction from finite fibres to the ring is a
    written proof; the equivalence of the four target laws in finite 1518-magmas (Vampire). The census files under
    lean/census use bv_decide (native evaluation) and are outside every compared declaration and outside the Lake
    libraries.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Fable 5.1 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        An AI agent working under the author's direction in interactive sessions wrote the search and verification
        scripts, transcribed the nine equational proofs found by Vampire 5.1.0 into lean/OneGenerated1518.lean,
        generated the finite decide-checked members and this Challenge/Solution pair (scripts/gen_palomar.py, which
        reads the laws from the project's equations file rather than transcribing them), and drafted the notes.
      cost:
        wall_time: "about three days of interactive sessions, September 2026"
        spend_usd: "subscription-based"
        hardware: "local machine (Apple M3 Pro, 11 cores); no cloud compute"
      prompting_notes: >-
        Interactive direction by the author; predictions were written down before the confirming computations were run
        (recorded in paper/L2_NOTE.md); every figure was recomputed by the author's own tooling.
    - method: manual
      tool_setup: >-
        The author chose the questions, directed the literature and Zulip searches, checked every statement against
        its source, and reviewed the Lean files and the notes.
  spend_usd: "subscription-based"
  notes: >-
    Vampire 5.1.0 found the equational proofs behind Theorem A from the two laws in milliseconds; the Lean transcription
    is a hand-readable sequence of rewrites checked by the kernel with no axioms. The finite members of Theorem F are
    checked by kernel decide on their coefficient-matrix definitions. Mace4 2009-11A, z3 4.16.0, exact rational
    arithmetic and sympy 1.14 (Gröbner bases) were used for the cross-checks and classifications reported in the
    notes, outside Lean.

fidelity:
  divergences: >-
    Theorem A is the source conjecture proved, not strengthened. The conjecture assumed 47, 614, 817 and 3862 and
    stated no finiteness hypothesis; this assumes 1518 and 3862 only, which is equivalent given that 1518 and 3862
    already imply the other three targets (Bolan, same thread, 2024-11-29). The Lean statements express "the submagma generated by x" through an explicit
    membership predicate inT and a word type W. Theorem F is not among the compared declarations; its F_5 and F_13
    members are kernel-checked in the repository's own library, and the general statement over a ring with a square root
    of −1 is not in Lean at all.

review:
  status: "self-assessed"
  notes: >-
    Statements audited by the author against the Equational Theories Project law text; the Lean law definitions are
    generated from the project's equations file. Cross-checks outside Lean: brute force on all 1518-magmas of size at
    most 6 for Theorem A (largest one-generated submagma has three elements); exact arithmetic in Q(i), brute force
    over F_9 and Z/25, and an isomorphism check against Le Floch's 15-element models for Theorem F. No external review
    has taken place; the results have not been discussed publicly at the time of this file.

alignment:
  namespace: "Magma1518"
  statements:
    - source: "Theorem 4 of paper/l2_note.pdf (Theorem A); Tao's conjecture, message 485148288"
      lean: "Magma1518.table"
      module: "Challenge"
      status: proved
      note: "u ◇ v = S v for all u, v in {x, S x, S (S x)}, under 1518 and 3862"
    - source: "Theorem 4 of paper/l2_note.pdf (Theorem A)"
      lean: "Magma1518.cube"
      module: "Challenge"
      status: proved
      note: "S (S (S x)) = x, stated as (S x ◇ S x) ◇ (S x ◇ S x) = x"
    - source: "Theorem 4 of paper/l2_note.pdf (Corollary A′)"
      lean: "Magma1518.words_in_T"
      module: "Challenge"
      status: proved
      note: "every word in x evaluates into {x, S x, S (S x)}"
    - source: "Theorem 4 of paper/l2_note.pdf (Corollary A′)"
      lean: "Magma1518.one_or_three"
      module: "Challenge"
      status: proved
      note: "one element or three pairwise distinct elements; uses classical case analysis"

